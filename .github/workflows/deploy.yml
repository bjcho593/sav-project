name: Deploy SAV to AWS

on:
  push:
    branches: [ main, qa ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Identity
        run: |
          # Construimos usando el contexto de la raíz para que Docker vea todo el proyecto
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/sav-identity:latest -f ./backend/apps/identity/Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sav-identity:latest

  deploy-to-aws:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en EC2 vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # 1. Crear directorio si no existe y entra
            mkdir -p ~/sav-project
            cd ~/sav-project
            
            # 2. Descargar el docker-compose.yml directamente desde tu GitHub (rama qa)
            curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 -L https://raw.githubusercontent.com/bjcho593/sav-project/qa/backend/docker-compose.yml \
                 -o docker-compose.yml
            
            # 3. Inyectar variables de entorno y levantar
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            docker-compose pull
            docker-compose up -d
            docker system prune -f # Mantenimiento de espacio en disco