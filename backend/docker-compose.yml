services:
  # INFRAESTRUCTURA
  postgres:
    image: postgres:15-alpine
    container_name: sav-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sav_db
    ports:
      - "5435:5432"
    networks:
      - sav-network

  # GATEWAY (Indispensable)
  identity:
    build: { context: ., dockerfile: apps/identity/Dockerfile }
    container_name: sav-identity
    ports: ["3000:3000"]
    depends_on: [postgres]
    networks: [sav-network]

  # NÚCLEO ACADÉMICO (Indispensables para el flujo del QR)
  session-manager:
    build: { context: ., dockerfile: apps/session-manager/Dockerfile }
    container_name: sav-session
    ports: ["3005:3005"]
    networks: [sav-network]

  enrollment:
    build: { context: ., dockerfile: apps/enrollment/Dockerfile }
    container_name: sav-enrollment
    ports: ["3006:3006"]
    networks: [sav-network]

  scheduling:
    build: { context: ., dockerfile: apps/scheduling/Dockerfile }
    container_name: sav-scheduling
    ports: ["3007:3007"]
    networks: [sav-network]

  academic:
    build: { context: ., dockerfile: apps/academic/Dockerfile }
    container_name: sav-academic
    ports: ["3008:3008"]
    networks: [sav-network]

  # --- SERVICIOS COMENTADOS PARA MAYOR RAPIDEZ ---
