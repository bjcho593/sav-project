version: '3.8'

services:
  # INFRAESTRUCTURA BASE
  postgres:
    image: postgres:15-alpine
    container_name: sav-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sav_db
    ports:
      - "5435:5432"
    networks:
      - sav-network

  # SERVICIO PRINCIPAL (GATEWAY)
  identity:
    build:
      context: .
      dockerfile: apps/identity/Dockerfile
    container_name: sav-identity
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - sav-network

  # SERVICIOS DE VALIDACIÓN (Síncronos vía TCP)
  session-manager:
    build: { context: ., dockerfile: apps/session-manager/Dockerfile }
    container_name: sav-session
    ports: ["3005:3005"]
    networks: [sav-network]

  enrollment:
    build: { context: ., dockerfile: apps/enrollment/Dockerfile }
    container_name: sav-enrollment
    ports: ["3006:3006"]
    networks: [sav-network]

  scheduling:
    build: { context: ., dockerfile: apps/scheduling/Dockerfile }
    container_name: sav-scheduling
    ports: ["3007:3007"]
    networks: [sav-network]

  # SERVICIOS DE EVENTOS (Asíncronos vía TCP)
  analytics:
    build: { context: ., dockerfile: apps/analytics/Dockerfile }
    container_name: sav-analytics
    ports: ["3001:3001"]
    networks: [sav-network]

  notifications:
    build: { context: ., dockerfile: apps/notifications/Dockerfile }
    container_name: sav-notifications
    ports: ["3002:3002"]
    networks: [sav-network]

  reports:
    build: { context: ., dockerfile: apps/reports/Dockerfile }
    container_name: sav-reports
    ports: ["3003:3003"]
    networks: [sav-network]

  audit:
    build: { context: ., dockerfile: apps/audit/Dockerfile }
    container_name: sav-audit
    ports: ["3004:3004"]
    networks: [sav-network]

networks:
  sav-network:
    driver: bridge